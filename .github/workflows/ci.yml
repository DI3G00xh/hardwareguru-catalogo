name: CI Pipeline

on:
  push:
    branches: [ main, master, pruebas, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Run Tests with Coverage Profile
        run: |
          go test -v -coverprofile=coverage.out ./internal/... ./tests/...

      - name: Check Minimum Coverage Threshold (>= 60%)
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//')
          echo "Cobertura total del núcleo: ${TOTAL_COVERAGE}%"
          awk -v cov="${TOTAL_COVERAGE}" 'BEGIN {
            if (cov < 60.0) {
              print "ERROR: La cobertura (" cov "%) es inferior al umbral requerido del 60%";
              exit 1;
            } else {
              print "SUCCESS: Cobertura (" cov "%) cumple holgadamente con el requisito (>= 60%)";
            }
          }'

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hardwareguru-catalogo:latest

