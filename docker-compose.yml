services:
  postgres:
    image: postgres:16-alpine
    container_name: hardwareguru-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hardwareguru_catalogo}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hardwareguru_catalogo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardwareguru-catalogo
    restart: unless-stopped
    environment:
      PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-hardwareguru_catalogo}
      DB_SSLMODE: disable
    ports:
      - "${PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
